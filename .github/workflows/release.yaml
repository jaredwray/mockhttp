name: release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare
      - run: sfw pnpm install --frozen-lockfile
      - run: pnpm test:ci

  publish:
    name: Stage publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare

      - name: Install Dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          mkdir -p packed
          pnpm pack --pack-destination packed
          ls -la packed

      - name: Stage publish
        # pnpm ≥ 11.3. --no-git-checks: git-checks run even for a tarball and
        # fail on a detached release-tag checkout and on the untracked pack output.
        run: pnpm stage publish ./packed/*.tgz --access public --provenance --no-git-checks
